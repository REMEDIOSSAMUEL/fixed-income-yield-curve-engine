[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fixed-income-yield-curve-engine"
version = "1.0.0"
description = "Fixed-income yield-curve, risk, and relative-value research engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Samuel Remedios"}]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["fixed_income*"]
namespaces = false

[tool.setuptools.package-data]
fixed_income = ["sample_data/*.csv"]

[tool.coverage.run]
data_file = "outputs/.coverage"
patch = ["subprocess"]

[tool.coverage.report]
precision = 2
show_missing = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
docstring-code-format = true
